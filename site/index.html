<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Red Headlines | BrightSign LS424</title>
<style>
  
@font-face {
  font-family: "DotoTicker";
  src: url("./Doto.ttf") format("truetype");
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
}

  :root {
    --ticker-red: #ff2020;
    --speed-px-per-second: 125;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { color: var(--ticker-red); }
  #screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #headline {
    position: absolute;
    left: 0;
    top: 50%;
    white-space: nowrap;
    font-family: "DotoTicker", "Courier New", monospace;
    font-size: 76px;
    font-weight: 700;
    letter-spacing: 0.07em;
    line-height: 1;
    color: var(--ticker-red);
    text-transform: uppercase;
    transform: translate3d(100vw, -50%, 0);
    will-change: transform;
  }
  @media (max-width: 1280px) { #headline { font-size: 46px; } }
  @keyframes move-left {
    from { transform: translate3d(100vw, -50%, 0); }
    to   { transform: translate3d(-100%, -50%, 0); }
  }
</style>
</head>
<body>
  <main id="screen" aria-label="24-headline rotating red news ticker">
    <div id="headline">DEMO — WAITING FOR LIVE HEADLINES</div>
  </main>
<script>
(function () {
  'use strict';
  // Keep this page minimal for the LS424's entry-level HTML5 engine.
  var node = document.getElementById('headline');
  var FEED_URL = './headlines.json'; // Same-origin file, not GitHub-specific.
  var POLL_MS = 5 * 60 * 1000;
  var SPEED = 125; // Pixels per second. Lower = slower.
  var DEMO = ['DEMO — WAITING FOR LIVE NEWS UPDATES'];
  var currentHeadlines = DEMO;
  var pendingHeadlines = null;
  var nextIndex = 0;
  var initialized = false;

  function isValid(feed) {
    return !!(feed && Array.isArray(feed.headlines) && feed.headlines.length &&
      feed.headlines.some(function (x) { return x && typeof x.title === 'string' && x.title.trim(); }));
  }

  function cleanHeadlines(feed) {
    return feed.headlines.map(function (x) { return (x.title || '').replace(/\s+/g, ' ').trim().slice(0, 120); })
      .filter(function (s) { return s.length > 0; }).slice(0, 24);
  }

  // Last received news survives ordinary network outages where storage is available.
  try {
    var cache = JSON.parse(localStorage.getItem('ls424LastGoodHeadlines') || 'null');
    if (cache && isValid(cache) && !cache.demo) currentHeadlines = cleanHeadlines(cache);
  } catch (e) { /* Continue with demo text if storage is unavailable. */ }

  function runNextHeadline() {
    if (pendingHeadlines) {
      currentHeadlines = pendingHeadlines;
      pendingHeadlines = null;
      nextIndex = 0;
    }
    var title = currentHeadlines[nextIndex % currentHeadlines.length];
    nextIndex++;
    node.textContent = title;
    node.style.animation = 'none';
    // Reset animation for compatibility with older Chromium releases.
    void node.offsetWidth;
    var width = Math.ceil(node.getBoundingClientRect().width);
    var duration = Math.max(8, (width + window.innerWidth) / SPEED);
    node.style.animation = 'move-left ' + duration.toFixed(2) + 's linear 1 forwards';
  }

  node.addEventListener('animationend', runNextHeadline);
  window.addEventListener('resize', runNextHeadline);

  function loadHeadlines() {
    // Cache bust, keeping the data endpoint on the exact same domain as index.html.
    fetch(FEED_URL + '?updated=' + Date.now(), {cache:'no-store'})
      .then(function (r) { if (!r.ok) throw Error('HTTP ' + r.status); return r.json(); })
      .then(function (feed) {
        if (!isValid(feed)) throw Error('Headline JSON is empty/invalid');
        var newer = cleanHeadlines(feed);
        if (newer.length === 0) throw Error('No headlines to display');
        var changed = JSON.stringify(newer) !== JSON.stringify(currentHeadlines);
        if (changed) {
          if (!initialized) { currentHeadlines = newer; nextIndex = 0; }
          else pendingHeadlines = newer; // No mid-scroll jump.
        }
        try { if (!feed.demo) localStorage.setItem('ls424LastGoodHeadlines', JSON.stringify(feed)); }
        catch (e) { /* Optional */ }
        if (!initialized) { initialized = true; runNextHeadline(); }
      })
      .catch(function (e) {
        console.warn('News feed unavailable; retaining last good content', e);
        if (!initialized) { initialized = true; runNextHeadline(); }
      });
  }

  // Start display without depending on successful network access.
  loadHeadlines();
  setInterval(loadHeadlines, POLL_MS);
  setTimeout(function () { if (!initialized) { initialized = true; runNextHeadline(); } }, 3000);
}());
</script>
</body>
</html>
